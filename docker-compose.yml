services:
  postgres:
    image: postgres:17-alpine
    container_name: hibi-booth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hibi_booth
      POSTGRES_USER: hibi_user
      POSTGRES_PASSWORD: hibi_local_password
    ports:
      - "5432:5432"
    volumes:
      - hibi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hibi_user -d hibi_booth"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hibi_pgdata:
